<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>コンテンツナレッジ</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="../../api/mindmap2/mindmap2.css" />
<link rel="stylesheet" href="./css/styles.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <i class="ti ti-movie brand-icon" aria-hidden="true"></i>
    <span class="brand">コンテンツナレッジ</span>
    <span id="sync-status" class="sync-status"></span>
    <div class="topbar-right">
      <div class="search-box">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input id="search" type="text" class="search-input" placeholder="タイトル・要約を検索" />
      </div>
      <button id="open-upload" class="btn"><i class="ti ti-upload" aria-hidden="true"></i>アップロード</button>
      <button id="reload" class="btn-ghost" aria-label="読み込み直す"><i class="ti ti-refresh" aria-hidden="true"></i></button>
      <button id="open-settings" class="btn-ghost" aria-label="設定"><i class="ti ti-settings" aria-hidden="true"></i></button>
      <span id="active-model" class="active-model"></span>
    </div>
  </header>

  <nav class="viewtabs">
    <button class="viewtab on" data-view="library"><i class="ti ti-files" aria-hidden="true"></i>コンテンツ</button>
    <button class="viewtab" data-view="ideas"><i class="ti ti-bulb" aria-hidden="true"></i>アイデア</button>
    <button class="viewtab" data-view="mindmaps"><i class="ti ti-sitemap" aria-hidden="true"></i>マインドマップ</button>
    <span class="grow"></span>
    <button id="open-vocab" class="btn-ghost" aria-label="タグを整理"><i class="ti ti-tags" aria-hidden="true"></i></button>
  </nav>

  <div id="tag-bar" class="tag-bar"></div>
  <main id="stage" class="stage"></main>
</div>

<div id="modal-root"></div>
<div id="mm-root"></div>
<div id="drop-overlay"><div class="drop-card"><i class="ti ti-upload" aria-hidden="true"></i>ここに落とすとアップロードします</div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
