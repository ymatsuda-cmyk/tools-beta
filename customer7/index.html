<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer7 - tools</title>
<style>
  /* シンプルな顧客ページ7 */
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#16202b;
    color:#cbd8e4;
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding:2rem;
    box-sizing:border-box;
  }
  h1{
    font-size:2rem;
    margin-bottom:1rem;
    text-align:center;
  }
  /* /api（mindmap2）を実際に動かして描画するための領域 */
  #mindmapHost{
    width:100%;
    max-width:800px;
    height:400px;
    background:#1e2c3a;
    border-radius:8px;
  }
  #apiStatus{
    margin-top:1rem;
    font-size:0.9rem;
    color:#9fb3c8;
  }
</style>
</head>
<body>
  <h1>顧客ページ7</h1>
  <div id="mindmapHost"></div>
  <p id="apiStatus">/api（mindmap2）を読み込んでいます…</p>

  <script type="module">
    // 既存の /api モジュール(mindmap2)を実際に呼び出し、
    // マインドマップを描画して動作を確認できるようにする
    import { renderMindmap } from '../api/mindmap2/mindmap2.js'

    const statusEl = document.getElementById('apiStatus')
    const hostEl = document.getElementById('mindmapHost')

    // 描画対象のサンプルMarkdown（顧客情報のツリー）
    const sampleMarkdown = [
      '# 顧客ページ7',
      '## 顧客A',
      '- 担当: 山田',
      '- 契約: 継続中',
      '## 顧客B',
      '- 担当: 佐藤',
      '- 契約: 新規',
    ].join('\n')

    try {
      // /api/mindmap2/mindmap2.js の renderMindmap を実際に実行し、
      // CDNからmarkmap一式を読み込んで本物のマインドマップを描画する
      await renderMindmap(hostEl, sampleMarkdown)
      statusEl.textContent = '/api（mindmap2）を実行し、マインドマップを描画しました'
    } catch (err) {
      // 読み込みや描画に失敗した場合はエラー内容を表示する
      statusEl.textContent = '/api（mindmap2）の実行に失敗しました: ' + err.message
    }
  </script>
</body>
</html>
