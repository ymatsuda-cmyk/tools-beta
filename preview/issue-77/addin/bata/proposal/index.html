<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提案ナレッジ</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="style.css">
<script src="roi-core.js?v=20260907a"></script>
</head>
<body>

<header id="app-header">
  <div class="hdr-left">
    <span class="hdr-title">提案ナレッジ</span>
    <span id="demo-badge" class="demo-badge" style="display:none">DEMO</span>
  </div>
  <div class="hdr-right">
    <button id="settings-btn" class="icon-btn" title="設定">⚙</button>
    <button id="reload-btn" class="icon-btn" title="再読み込み">⟳</button>
  </div>
</header>

<nav id="tab-nav">
  <button class="tab-btn active" data-tab="hearing">① 議事録入力</button>
  <button class="tab-btn" data-tab="proposal">② 提案</button>
  <button class="tab-btn" data-tab="prompt">③ プロンプト出力</button>
</nav>

<main id="app-main">

  <!-- ====== ① 議事録入力 ====== -->
  <section id="pane-hearing" class="pane active">

    <div class="field-row">
      <label>案件</label>
      <select id="case-select"><option value="">案件を選択してください</option></select>
      <input type="hidden" id="case-id">
    </div>

    <div id="hearing-area" style="display:none">
      <div class="mini-box" style="margin-bottom:12px">
        <div class="box-head">
          <span id="hearing-count">この案件の議事録</span>
          <button id="add-log-btn" class="btn btn-sm">＋ 追加</button>
        </div>
        <div id="hearing-log-list" class="log-list"></div>
      </div>

      <div id="log-form" style="display:none">
        <div class="field-row col">
          <label>タイトル</label>
          <input id="log-title" placeholder="例: 初回訪問ヒアリング">
        </div>
        <div class="field-row col">
          <label>参照URL</label>
          <input id="hearing-url" placeholder="議事録ビューア等へのリンク（任意）">
        </div>
        <div class="field-row col">
          <label>本文</label>
          <textarea id="hearing-text" rows="5" placeholder="議事録の文字起こし、または要点メモを貼り付け（URLのみでも可）"></textarea>
        </div>
        <div class="btn-row">
          <button id="save-log-btn" class="btn btn-accent">議事録に追加</button>
          <button id="cancel-log-btn" class="btn">取消</button>
        </div>
      </div>

      <button id="extract-btn" class="btn btn-accent" style="width:100%">課題を抽出</button>
      <div id="extract-status" class="status-line"></div>

      <div id="extract-review" style="display:none">
        <div class="review-title">再抽出の結果を反映しますか</div>
        <div class="hint-sm" style="margin-bottom:8px">編集済みの課題は既定で「残す」になっています</div>
        <div id="extract-items"></div>
        <div class="btn-row">
          <button id="cancel-extract-btn" class="btn">取消</button>
          <button id="apply-extract-btn" class="btn btn-accent" style="flex:2">選択した内容で反映</button>
        </div>
      </div>
    </div>

    <div class="section-title">案件の状況</div>
    <div id="case-overview"></div>
  </section>

  <!-- ====== ② 提案 ====== -->
  <section id="pane-proposal" class="pane">
    <div class="field-row col">
      <label>案件</label>
      <select id="case-select-2"><option value="">案件を選択してください</option></select>
      <input type="hidden" id="case-id-2">
    </div>

    <div id="totals" class="totals-box" style="display:none">
      <div class="totals-grid">
        <div>
          <div class="t-label">損失合計 / 年</div>
          <div id="t-loss" class="t-value">—</div>
          <div id="t-loss-cf" class="t-sub">—</div>
        </div>
        <div>
          <div class="t-label">全体回収</div>
          <div id="t-pay" class="t-value">—</div>
          <div id="t-pay-cf" class="t-sub">—</div>
        </div>
      </div>
    </div>

    <div id="proposal-list"></div>
  </section>

  <!-- ====== ③ プロンプト出力 ====== -->
  <section id="pane-prompt" class="pane">
    <div class="field-row col">
      <label>案件</label>
      <select id="case-select-3"><option value="">案件を選択してください</option></select>
      <input type="hidden" id="case-id-3">
    </div>
    <button id="build-prompt-btn" class="btn">提案に含めた課題からプロンプトを組み立て</button>

    <div id="prompt-output"></div>
  </section>

</main>

<!-- ====== 設定パネル ====== -->
<div id="settings-modal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-title">設定</div>
    <div class="field-row col">
      <label>プロバイダ</label>
      <select id="cfg-provider">
        <option value="anthropic">Anthropic（Claude）</option>
        <option value="openai">OpenAI互換（Gemini等）</option>
      </select>
    </div>
    <div class="field-row col">
      <label>ベースURL（OpenAI互換の場合は必須）</label>
      <input id="cfg-baseurl" placeholder="例: https://api.anthropic.com/v1/messages">
    </div>
    <div class="field-row col">
      <label>APIキー</label>
      <input id="cfg-apikey" type="password" placeholder="sk-ant-...">
    </div>
    <div class="field-row col">
      <label>モデル</label>
      <input id="cfg-model" placeholder="例: claude-sonnet-4-6">
    </div>
    <p class="hint">社内利用限定の前提です。このAPIキーはブラウザに保存され、開発者ツールから見える状態になります。社外に公開しないでください。</p>
    <div class="btn-row">
      <button id="cfg-save-btn" class="btn btn-accent">保存</button>
      <button id="cfg-close-btn" class="btn">閉じる</button>
    </div>
  </div>
</div>

<!-- ====== カテゴリ割り当てモーダル ====== -->
<div id="assign-modal" class="modal-overlay" style="display:none">
  <div class="modal-box" style="max-width:400px">
    <div class="modal-title">カテゴリを割り当てる</div>
    <div id="assign-issue" class="mini-box" style="margin-bottom:10px"></div>

    <div id="assign-pick">
      <div class="lbl-sm">AIが提示した候補</div>
      <div id="assign-candidates"></div>
      <div class="btn-row">
        <button id="assign-apply-btn" class="btn btn-accent" style="flex:2">この候補で割り当てる</button>
        <button id="assign-chat-btn" class="btn">AIと相談</button>
      </div>
      <button id="assign-nocat-btn" class="btn" style="width:100%">どれも違う（カテゴリなしで提案に進む）</button>
    </div>

    <div id="assign-chat" style="display:none">
      <div id="chat-log" class="chat-log"></div>
      <div id="chat-def" class="def-box"></div>
      <input id="chat-input" placeholder="続けて相談する（例: 対応人数も入れたい）">
      <div class="btn-row">
        <button id="chat-send-btn" class="btn">送信</button>
      </div>
      <div class="btn-row">
        <button id="chat-save-common-btn" class="btn btn-accent">マスタに登録</button>
        <button id="chat-save-temp-btn" class="btn">この案件だけに使う</button>
      </div>
      <div class="hint-sm">「この案件だけ」を選ぶと一時カテゴリとして登録され、他案件には出ません。後からマスタ化できます。</div>
    </div>

    <div class="btn-row"><button id="assign-close-btn" class="btn" style="width:100%">閉じる</button></div>
  </div>
</div>

<script src="app.js?v=20260907a"></script>
</body>
</html>
