<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>議事録ビューア</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./css/styles.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <i class="ti ti-microphone" aria-hidden="true"></i>
    <span class="app-title">議事録</span>
    <span id="sync-status" class="sync-status"></span>
    <div class="topbar-scroll">
      <div class="search-box">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="search-input" class="search-input" placeholder="要約を検索" />
      </div>
      <div class="status-filter" id="status-filter">
        <span class="status-filter-chip" data-status="文字起こし">文字起こし</span>
        <span class="status-filter-chip" data-status="再取得">再取得</span>
        <span class="status-filter-chip" data-status="要約">要約</span>
      </div>
      <button id="assign-permission" class="btn-ghost" aria-label="権限を割り当て"><i class="ti ti-users" aria-hidden="true"></i></button>
      <button id="bulk-summarize" class="btn-ghost" aria-label="一括要約"><i class="ti ti-sparkles" aria-hidden="true"></i></button>
      <button id="cross-chat-btn" class="btn-ghost" aria-label="横断チャット"><i class="ti ti-messages" aria-hidden="true"></i></button>
      <button id="open-upload" class="btn-ghost" aria-label="音声をアップロード"><i class="ti ti-upload" aria-hidden="true"></i></button>
      <button id="open-settings" class="btn-ghost" aria-label="設定"><i class="ti ti-settings" aria-hidden="true"></i></button>
      <span id="active-model" class="active-model"></span>
    </div>
  </header>

  <div id="assign-bar"></div>
  <div id="bulk-progress"></div>

  <main class="layout">
    <aside id="list" class="list-pane">
      <div id="toolbar"></div>
      <div id="list-items"></div>
    </aside>
    <div id="resize-handle" class="resize-handle" role="separator" aria-orientation="vertical" aria-label="一覧の幅を変更"></div>
    <section id="detail" class="detail-pane">
      <div class="detail-zoom-bar">
        <button id="detail-zoom-out" class="btn-ghost" aria-label="縮小"><i class="ti ti-minus" aria-hidden="true"></i></button>
        <span id="detail-zoom-level">100%</span>
        <button id="detail-zoom-in" class="btn-ghost" aria-label="拡大"><i class="ti ti-plus" aria-hidden="true"></i></button>
      </div>
      <div id="detail-content">
        <div class="empty-state">
          <i class="ti ti-file-text" aria-hidden="true"></i>
          <p>左の一覧から議事録を選んでください</p>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="modal-root"></div>
<script type="module" src="./src/main.js"></script>
<script type="module" src="./src/upload.js"></script>
</body>
</html>
