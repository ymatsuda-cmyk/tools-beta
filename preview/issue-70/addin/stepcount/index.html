<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ステップ数集計</title>
<link rel="stylesheet" href="taskpane.css">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>

<div id="boot" class="boot">
  <p class="boot-msg">Excel に接続しています…</p>
</div>

<div id="app" class="app" hidden>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" role="tab" data-tab="dashboard" aria-selected="true">ダッシュボード</button>
    <button class="tab" role="tab" data-tab="source" aria-selected="false">ソース一覧</button>
    <button class="tab" role="tab" data-tab="assign" aria-selected="false">割当</button>
  </nav>

  <div class="statusbar">
    <span id="status-count">—</span>
    <button id="btn-reload" class="icon-btn" title="データを読み直す" aria-label="データを読み直す">↻</button>
  </div>

  <!-- ダッシュボード -->
  <section id="panel-dashboard" class="panel" role="tabpanel">
    <div class="controls">
      <div id="dash-cats" class="cats"></div>
    </div>
    <div class="dash-scroll">
      <div id="dash-metrics" class="metrics"></div>
      <div class="dash-section">
        <div class="dash-title">取引先別</div>
        <div id="dash-vendors"></div>
      </div>
      <div class="dash-section">
        <div class="dash-title">拡張子別（全体・未割当を除く）</div>
        <div id="dash-exts"></div>
      </div>
    </div>
  </section>

  <!-- ソース一覧 -->
  <section id="panel-source" class="panel" role="tabpanel" hidden>
    <div class="controls">
      <div id="src-cats" class="cats" style="margin-bottom:8px"></div>
      <div class="field-label">取引先</div>
      <div id="pv" class="pills"></div>
    </div>
    <div id="src-metrics" class="metrics metrics-sm"></div>
    <div class="controls">
      <div class="field-label">拡張子</div>
      <div id="pe" class="pills"></div>
    </div>
    <div id="src-head" class="src-head"></div>
    <div id="src-rows" class="src-rows"></div>
    <div class="actions">
      <button id="btn-export" class="btn btn-primary">出力</button>
    </div>
  </section>

  <!-- 割当 -->
  <section id="panel-assign" class="panel" role="tabpanel" hidden>
    <div class="controls">
      <div class="field-label">編集する取引先</div>
      <div id="pav" class="pills" style="margin-bottom:8px"></div>
      <div class="row">
        <input id="new-vendor" placeholder="新しい取引先名">
        <button id="btn-add-vendor" class="btn">取引先を追加</button>
      </div>
      <div class="hint" style="margin-top:4px">チェックしたフォルダとその配下すべてに、この取引先名を直接書き込みます。</div>
      <div class="row row-tight">
        <label class="field-label" for="depth-open">展開</label>
        <select id="depth-open">
          <option value="0">0階層</option>
          <option value="1">1階層</option>
          <option value="2" selected>2階層</option>
          <option value="3">3階層</option>
        </select>
        <button id="btn-focus" class="btn" style="padding:3px 8px">選択のみ表示</button>
        <span class="spacer"></span>
        <span class="hint" id="diff-count">変更なし</span>
      </div>
    </div>
    <div id="tree" class="tree"></div>
    <div class="actions">
      <button id="btn-discard" class="btn">取り消し</button>
      <button id="btn-save" class="btn btn-primary">保存</button>
    </div>
  </section>

  <p id="toast" class="toast" hidden></p>
</div>

<script src="taskpane.js"></script>
</body>
</html>
