<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>疎通確認 | Issue 68</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #5f6368;
      --line: #d8dee4;
      --paper: #ffffff;
      --surface: #f6f8fa;
      --accent: #0f766e;
      --accent-strong: #0b5f59;
      --ok: #15803d;
      --warn: #b45309;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.14), rgba(245, 158, 11, 0.10)),
        var(--surface);
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 18px 45px rgba(32, 33, 36, 0.10);
    }

    .hero {
      display: grid;
      gap: 18px;
      padding: 40px;
      color: #ffffff;
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.96), rgba(180, 83, 9, 0.88)),
        #0f766e;
    }

    .label {
      width: fit-content;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 999px;
      font-size: 0.82rem;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .lead {
      max-width: 640px;
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .content {
      display: grid;
      gap: 20px;
      padding: 28px;
    }

    .status {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: center;
      padding: 18px;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      background: #f0fdf4;
    }

    .status-mark {
      display: inline-grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 50%;
      color: #ffffff;
      font-weight: 700;
      background: var(--ok);
    }

    .status h2 {
      margin: 0 0 4px;
      font-size: 1.12rem;
      letter-spacing: 0;
    }

    .status p {
      margin: 0;
      color: #166534;
      line-height: 1.6;
    }

    dl {
      display: grid;
      grid-template-columns: minmax(120px, 180px) 1fr;
      gap: 1px;
      overflow: hidden;
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--line);
    }

    dt,
    dd {
      margin: 0;
      padding: 14px 16px;
      background: var(--paper);
      overflow-wrap: anywhere;
    }

    dt {
      color: var(--muted);
      font-weight: 700;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      background: var(--accent);
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background: var(--accent-strong);
    }

    .note {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .warning {
      color: var(--warn);
      font-weight: 700;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 920px);
        padding: 20px 0;
      }

      .hero,
      .content {
        padding: 24px;
      }

      dl {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="page-title">
      <div class="hero">
        <span class="label">Issue #68</span>
        <h1 id="page-title">疎通確認</h1>
        <p class="lead">GitHub Pages の検証環境で、静的HTMLが配信されていることを確認するためのページです。</p>
      </div>

      <div class="content">
        <section class="status" aria-live="polite">
          <span class="status-mark" aria-hidden="true">OK</span>
          <div>
            <h2 id="status-title">ページを読み込みました</h2>
            <p id="status-message">JavaScript の初期化待ちです。</p>
          </div>
        </section>

        <dl aria-label="確認情報">
          <dt>確認日時</dt>
          <dd id="checked-at">未取得</dd>
          <dt>表示URL</dt>
          <dd id="page-url">未取得</dd>
          <dt>ユーザーエージェント</dt>
          <dd id="user-agent">未取得</dd>
          <dt>セルフチェック</dt>
          <dd id="self-check">未実行</dd>
        </dl>

        <div class="actions">
          <button type="button" id="refresh-button">再確認</button>
        </div>

        <p class="note">このページは疎通確認用の使い捨てページです。外部APIやビルド処理には依存していません。</p>
      </div>
    </section>
  </main>

  <script>
    const checkedAt = document.getElementById('checked-at');
    const pageUrl = document.getElementById('page-url');
    const userAgent = document.getElementById('user-agent');
    const selfCheck = document.getElementById('self-check');
    const statusMessage = document.getElementById('status-message');
    const refreshButton = document.getElementById('refresh-button');

    function formatDate(date) {
      return new Intl.DateTimeFormat('ja-JP', {
        dateStyle: 'full',
        timeStyle: 'medium'
      }).format(date);
    }

    function runConnectivityCheck() {
      const requiredElements = [checkedAt, pageUrl, userAgent, selfCheck, statusMessage, refreshButton];
      const allElementsReady = requiredElements.every(Boolean);

      if (!allElementsReady) {
        document.body.classList.add('warning');
        return;
      }

      checkedAt.textContent = formatDate(new Date());
      pageUrl.textContent = window.location.href;
      userAgent.textContent = navigator.userAgent;
      selfCheck.textContent = '必要な表示要素を確認しました';
      statusMessage.textContent = '静的ページの表示とJavaScriptの実行を確認できました。';
    }

    refreshButton.addEventListener('click', runConnectivityCheck);
    runConnectivityCheck();
  </script>
</body>
</html>
