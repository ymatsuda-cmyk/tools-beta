<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カラーチェンジャー | customer11</title>
  <style>
    /* 画面全体の色をJavaScriptで動的に切り替えるための変数（大人っぽい落ち着いた初期色） */
    :root {
      --bg1: #6b7a8f;
      --bg2: #8a7361;
      --accent: #c9a876;
      --ink: #2b2b2b;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      background-size: 200% 200%;
      transition: background 0.6s ease;
      overflow: hidden;
    }

    main {
      width: min(720px, calc(100% - 32px));
      padding: 40px;
      text-align: center;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      transition: box-shadow 0.4s ease;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      letter-spacing: 0.02em;
    }

    p.lead {
      margin: 0 0 28px;
      color: #444;
      line-height: 1.8;
    }

    .swatch {
      display: inline-block;
      width: 100%;
      max-width: 320px;
      height: 90px;
      margin: 0 auto 28px;
      border-radius: 14px;
      background: var(--accent);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
      transition: background 0.5s ease, transform 0.3s ease;
    }

    .swatch.pulse {
      transform: scale(1.05);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-bottom: 20px;
    }

    button {
      min-height: 48px;
      padding: 0 24px;
      border: none;
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      color: #ffffff;
      background: var(--bg1);
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
      transition: transform 0.15s ease, background 0.4s ease;
    }

    button:hover,
    button:focus-visible {
      transform: translateY(-2px) scale(1.03);
    }

    button:active {
      transform: translateY(0) scale(0.98);
    }

    #autoToggle.active {
      background: var(--bg2);
    }

    .counter {
      color: #555;
      font-size: 0.95rem;
    }

    .counter strong {
      color: var(--ink);
      font-size: 1.2rem;
    }

    .note {
      margin-top: 20px;
      font-size: 0.82rem;
      color: #666;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">🎨 カラーチェンジャー</h1>
    <p class="lead">ボタンを押すたびに、画面全体の色が落ち着いたトーンでランダムに変わります。<br>大人っぽい配色との出会いをお楽しみください。</p>

    <div class="swatch" id="swatch" aria-hidden="true"></div>

    <div class="actions">
      <button type="button" id="changeButton">色を変える！</button>
      <button type="button" id="autoToggle">自動チェンジ: OFF</button>
    </div>

    <p class="counter">色を変えた回数: <strong id="counter">0</strong> 回</p>

    <p class="note">外部APIは使用していません。すべてこのページ内のJavaScriptだけで動作します。</p>
  </main>

  <script>
    // 大人っぽい落ち着いた配色になるよう、彩度を抑え・明度を中間〜やや暗めに固定してランダムな色相を生成する
    const swatch = document.getElementById('swatch');
    const changeButton = document.getElementById('changeButton');
    const autoToggle = document.getElementById('autoToggle');
    const counterEl = document.getElementById('counter');

    let count = 0;
    let autoTimer = null;

    // 0〜360のランダムな色相からHSL文字列を作る
    function randomHslColor(saturation, lightness) {
      const hue = Math.floor(Math.random() * 360);
      return 'hsl(' + hue + ', ' + saturation + '%, ' + lightness + '%)';
    }

    function applyRandomColors() {
      const bg1 = randomHslColor(28, 42);
      const bg2 = randomHslColor(24, 34);
      const accent = randomHslColor(32, 58);

      document.documentElement.style.setProperty('--bg1', bg1);
      document.documentElement.style.setProperty('--bg2', bg2);
      document.documentElement.style.setProperty('--accent', accent);

      swatch.classList.add('pulse');
      setTimeout(() => swatch.classList.remove('pulse'), 300);

      count += 1;
      counterEl.textContent = String(count);
    }

    changeButton.addEventListener('click', applyRandomColors);

    autoToggle.addEventListener('click', () => {
      const isActive = autoToggle.classList.toggle('active');
      if (isActive) {
        autoToggle.textContent = '自動チェンジ: ON';
        autoTimer = window.setInterval(applyRandomColors, 800);
      } else {
        autoToggle.textContent = '自動チェンジ: OFF';
        if (autoTimer) {
          window.clearInterval(autoTimer);
          autoTimer = null;
        }
      }
    });

    // 初期表示時にも一度ランダムな色を適用しておく
    applyRandomColors();
  </script>
</body>
</html>
