<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer5 - tools</title>
<style>
  /* シンプルな顧客ページ */
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#16202b;
    color:#cbd8e4;
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding:2rem;
    box-sizing:border-box;
  }
  #app{
    max-width:640px;
    text-align:center;
  }
  h1{
    font-size:2rem;
    margin-bottom:1rem;
  }
  p{
    line-height:1.8;
    font-size:1rem;
  }
  /* /api 利用結果の表示欄 */
  #apiResult{
    margin-top:1.5rem;
    padding:1rem;
    background:#1e2c3a;
    border-radius:8px;
    text-align:left;
    font-size:0.9rem;
    white-space:pre-wrap;
    word-break:break-all;
  }
</style>
</head>
<body>
  <div id="app">
    <h1>顧客ページ</h1>
    <div id="apiResult">/api を読み込んでいます…</div>
  </div>

  <script type="module">
    // 既存の /api モジュール(mindmap2)の関数を流用し、
    // 「/apiを利用したページ」であることを示すサンプル呼び出し
    import { splitPrefix, nodeLineIndexes } from '../api/mindmap2/mindmap2.js'

    const resultEl = document.getElementById('apiResult')

    try {
      // サンプルのMarkdown風テキストをAPIの関数で解析する
      const sampleMarkdown = '# 顧客一覧\n- 顧客A\n- 顧客B'
      const { lines, indexes } = nodeLineIndexes(sampleMarkdown)
      const parsed = indexes.map((i) => splitPrefix(lines[i]))

      resultEl.textContent =
        '/api/mindmap2/mindmap2.js を利用した解析結果:\n' +
        JSON.stringify(parsed, null, 2)
    } catch (err) {
      // /api の読み込みや実行に失敗した場合はエラー内容を表示する
      resultEl.textContent = '/api の呼び出しに失敗しました: ' + err.message
    }
  </script>
</body>
</html>
